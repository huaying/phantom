name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Check server (Windows features)
        run: cargo check -p phantom-server --features audio
      - name: Check client (Windows features, no dav1d)
        run: cargo check -p phantom-client --no-default-features --features audio
      - name: Clippy server (release features)
        run: cargo clippy -p phantom-server --all-targets -- -D warnings
      - name: Clippy client (release features, no dav1d)
        run: cargo clippy -p phantom-client --no-default-features --features audio --all-targets -- -D warnings
      - name: Windows installer doctor regression
        shell: powershell
        run: ./scripts/validation/test-windows-doctor.ps1

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libxcb1-dev libxcb-shm0-dev libxcb-randr0-dev libxdo-dev \
            libdav1d-dev nasm cmake \
            libpulse-dev libopus-dev libasound2-dev python3-gi
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build WASM (needed for server)
        run: |
          cargo install wasm-pack --version 0.14.0 --locked
          wasm-pack build crates/web --target web --no-typescript
      - name: Verify generated web bundle is committed
        run: git diff --exit-code -- crates/web/pkg
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Doc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
      - name: Test
        run: cargo test --workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audio measurement and buffer regression
        run: |
          node scripts/validation/test-media-soak-monitor.mjs
          node scripts/validation/test-wss-audio-buffer.mjs
      - name: Linux installer regression
        run: PHANTOM_TEST_REQUIRE_GIO=1 python3 scripts/validation/test-linux-installer.py
